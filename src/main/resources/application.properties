spring.application.name=financeflow
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/financeflow}
spring.datasource.username=${DB_USER:financeflow}
spring.datasource.password=${DB_PASSWORD:financeflow_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-numbers-for-enums=true
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
